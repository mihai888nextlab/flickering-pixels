# Local Postgres for Flickering Pixels (users, sessions, and app data).
# Start:  docker compose up -d     Stop: docker compose down     Wipe data: docker compose down -v
services:
  db:
    image: postgres:17-alpine
    container_name: flickering-pixels-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flicker
      POSTGRES_PASSWORD: flicker
      POSTGRES_DB: flickering_pixels
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flicker -d flickering_pixels"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
