# Production stack: SPHEREx API + Next.js + Caddy (automatic HTTPS). No accounts, no database.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Only Caddy is reachable from outside (ports 80/443). Everything else stays on the internal network.
name: flickering-pixels

services:
  api:
    build: ./spherex-blink-demo
    restart: unless-stopped
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      SPHEREX_CONCURRENCY: ${SPHEREX_CONCURRENCY:-14}
    volumes:
      - spherex-cache:/data/cache

  web:
    build: { context: ., target: runner, args: { SPHEREX_API_URL: "http://api:8000" } }
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  spherex-cache:
  caddy-data:
  caddy-config:
